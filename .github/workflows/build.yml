name: Build NEXUS OS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: nexus-os-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Debian Live ISO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install live-build toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            isolinux syslinux-common syslinux-utils \
            grub-pc-bin grub-efi-amd64-bin dosfstools mtools \
            ca-certificates curl git

      - name: Configure Debian Trixie Live
        run: |
          lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components username=nexus hostname=nexus locales=en_US.UTF-8 keyboard-layouts=us" \
            --apt-recommends false

      - name: Build ISO
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee build.log
        shell: bash

      - name: Verify ISO and create checksum
        id: verify
        run: |
          set -euo pipefail
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -printf '%f\n' | head -n1)"
          test -n "$ISO"
          SIZE="$(stat -c '%s' "$ISO")"
          echo "ISO: $ISO"
          du -h "$ISO"
          if [ "$SIZE" -ge 2000000000 ]; then
            echo "::error::ISO is 2 GiB or larger; GitHub Release asset limit would be exceeded."
            exit 1
          fi
          file "$ISO"
          xorriso -indev "$ISO" -report_el_torito as_mkisofs
          sha256sum "$ISO" > SHA256SUMS
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nexus-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "${{ steps.verify.outputs.iso }}" SHA256SUMS \
            --title "NEXUS OS ${TAG}" \
            --notes "Automated Debian Trixie Live ISO build. Architecture: amd64. Verify the download with SHA256SUMS. This is an early development build; test in a virtual machine before installing on physical hardware."
